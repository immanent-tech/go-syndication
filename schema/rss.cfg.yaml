package: rss
output: ../rss/rss.gen.go
generate:
  models: true
output-options:
  skip-prune: true
import-mapping:
  extensions.yaml: "github.com/immanent-tech/go-syndication/extensions"
  content.yaml: "github.com/immanent-tech/go-syndication/extensions/content"
  syndication.yaml: "github.com/immanent-tech/go-syndication/extensions/syndication"
  link.yaml: "github.com/immanent-tech/go-syndication/extensions/link"
  dc.yaml: "github.com/immanent-tech/go-syndication/extensions/dc"
  media-rss.yaml: "github.com/immanent-tech/go-syndication/extensions/media"
  itunes.yaml: "github.com/immanent-tech/go-syndication/extensions/itunes"
  googleplay.yaml: "github.com/immanent-tech/go-syndication/extensions/googleplay"
  slash.yaml: "github.com/immanent-tech/go-syndication/extensions/slash"
  source.yaml: "github.com/immanent-tech/go-syndication/extensions/source"
  basicgeo.yaml: "github.com/immanent-tech/go-syndication/extensions/basicgeo"
  georss.yaml: "github.com/immanent-tech/go-syndication/extensions/georss"
  rdf.yaml: "github.com/immanent-tech/go-syndication/rdf"
  atom.yaml: "github.com/immanent-tech/go-syndication/atom"
