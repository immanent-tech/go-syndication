---
openapi: '3.1.0'
info:
  version: 1.0.0
  title: Common Types
  description: >
    Common/shared types across schemas.
  contact:
    name: 'Joshua Rich'
    email: joshua.rich@gmail.com
  license:
    identifier: MIT
components:
  schemas:
    Attributes:
      description: >
        are any attributes of the element.
      type: array
      items:
        x-go-type: xml.Attr
      x-oapi-codegen-extra-tags:
        xml: ',any,attr'
        json: 'attributes'
      x-go-type-skip-optional-pointer: true
    Extension:
      description: >
        represents an element that is not defined in the schema.
      type: object
      required:
        - XMLName
        - content
      properties:
        XMLName:
          x-go-type: 'xml.Name'
          x-oapi-codegen-extra-tags:
            json: 'xml'
            validate: 'required'
        content:
          description: is the element value.
          type: string
          x-oapi-codegen-extra-tags:
            xml: ',innerxml'
            validate: 'required'
        attributes:
          $ref: '#/components/schemas/Attributes'
    ImageInfo:
      description: >
        is an abstraction of an Image across different types of specifications.
      type: object
      required:
        - url
      properties:
        title:
          description: >
            the description of the image
          type: string
        url:
          description: >
            is the URL to the image.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            xml: ',chardata'
            validate: 'required,url'
      x-oapi-codegen-extra-tags:
        validate: 'omitempty'
