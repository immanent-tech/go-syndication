---
openapi: '3.1.0'
info:
  version: 1.0.0
  title: Generic types/interface for different feed formats
  description: >
    Feeds provides generic types and interfaces for working with different feed syndication formats.
  contact:
    name: 'Joshua Rich'
    email: joshua.rich@gmail.com
  license:
    identifier: MIT
components:
  schemas:
    SourceType:
      description: >
        is the type of source the feed or object came from. This can be used with abstractions that generalize different
        feed types into a common format to preserve information on the original.
      type: string
      enum: ['HTML', 'RSS', 'Atom', 'JSONFeed', 'RDF', 'Unknown']
      x-oapi-codegen-extra-tags:
        validate: 'oneof=HTML RSS Atom JSONFeed RDF Unknown'
    Image:
      description: represents a remote image.
      type: object
      required:
        - URL
      properties:
        URL:
          description: the URL to the image.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required,url'
        description:
          description: is a description of the image (for example, the alt tag associated with the image).
          type: string
    Address:
      description: >
        is an 'address', usually of a person. For example, an email, website or social media handle. An address has a
        type and a value and/or URI associated with it.
      type: object
      required:
        - type
        - value
      properties:
        type:
          description: >
            is the type of address. While there are some canonical values for the type, they are not conclusive and the
            type can be any value, including one of the canonical types. However, a canonical type should be used
            whenever appropriate.
          type: string
          enum: ['email', 'website']
          x-oapi-codegen-extra-tags:
            validate: 'required'
        value:
          description: is a value of the address. This must be set if the URI is missing.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required_without=URI'
        URI:
          description: is the URI of the address. This must be set if the value is missing.
          type: string
          x-go-name: URI
          x-oapi-codegen-extra-tags:
            validate: 'required_without=Value,uri'
    Person:
      description: represents a person.
      type: object
      required:
        - name
      properties:
        name:
          description: is the person's name.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        links:
          description: are links associated with the person that provide more details about them.
          type: array
          items:
            $ref: '#/components/schemas/Address'
          x-go-type-skip-optional-pointer: true
