---
openapi: "3.1.0"
info:
  version: 1.0.0
  title: Comment API Namespace Schema
  description: >
    The Comment API namespace enables an Atom, RSS 1.0 or RSS 2.0 feed to support comments in two useful ways --
    publicizing the URL of feeds that contain an item's comments and providing a REST interface that enables an RSS
    reader to take comments on a form presented along with feed items and send that comment to the publisher of that
    feed.

    https://www.rssboard.org/comment-api
  contact:
    name: "Joshua Rich"
    email: joshua.rich@gmail.com
  license:
    identifier: MIT
components:
  schemas:
    CommentRSS:
      description: >
        identifies the URL of an RSS feed that contains user comments submitted in response to that item.
      type: string
      x-oapi-codegen-extra-tags:
        json: "comment_rss,omitempty"
        xml: "http://wellformedweb.org/CommentAPI/ commentRss,omitempty"
    CommentRSSLegacy:
      description: >
        is the documented historical misspelling. Deliberately named and commented to discourage populating it when
        PRODUCING a feed: only CommentRSS is ever marshaled, so setting this field on an outbound Item has no effect.
        Use EffectiveCommentRSS() to read whichever spelling a decoded feed actually used.
      type: string
      x-oapi-codegen-extra-tags:
        json: "comment_rss_legacy,omitempty"
        xml: "http://wellformedweb.org/CommentAPI/ commentRSS,omitempty"
    Comment:
      description: >
        identifies a URL endpoint that can receive a comment to the item as a HTTP POST request and save the comment.
      type: string
      x-oapi-codegen-extra-tags:
        json: "comment,omitempty"
        xml: "http://wellformedweb.org/CommentAPI/ comment,omitempty"
    CommentElements:
      description: >
        contains all comment namespace elements.
      type: object
      properties:
        CommentRSS:
          $ref: "#/components/schemas/CommentRSS"
        CommentRSSLegacy:
          $ref: "#/components/schemas/CommentRSSLegacy"
        Comment:
          $ref: "#/components/schemas/Comment"
    CommentSubmission:
      description: >
        is the documented comment-submission protocol: wfw:comment's URL accepts an HTTP POST whose body is an
        RSS-item-shaped XML document with up to six optional elements (title/author/link/description/source, plus
        dc:creator), title or description required.
      type: object
      required:
        - XMLName
      properties:
        XMLName:
          x-go-type: xml.Name
          x-oapi-codegen-extra-tags:
            json: "item"
            xml: "item"
            validate: "required"
        title:
          type: string
          x-oapi-codegen-extra-tags:
            xml: "title,omitempty"
        author:
          type: string
          x-oapi-codegen-extra-tags:
            xml: "author,omitempty"
        link:
          type: string
          x-oapi-codegen-extra-tags:
            xml: "link,omitempty"
        description:
          type: string
          x-oapi-codegen-extra-tags:
            xml: "description,omitempty"
        source:
          type: string
          x-oapi-codegen-extra-tags:
            xml: "source,omitempty"
