---
openapi: "3.1.0"
info:
  version: 1.0.0
  title: Syndication Namespace Schema
  description: >
    The Syndication namespace provides information about the frequency and timing of feed updates. It helps aggregators
    understand how often to check for new content.

    http://purl.org/rss/1.0/modules/syndication/
  contact:
    name: "Joshua Rich"
    email: joshua.rich@gmail.com
  license:
    name: MIT
    identifier: MIT
components:
  schemas:
    SYUpdatePeriod:
      description: >
        is the period over which the channel format is updated.
      type: string
      default: "daily"
      enum: ["hourly", "daily", "weekly", "monthly", "yearly"]
      x-enum-varnames:
        [
          "UpdatedHourly",
          "UpdatedDaily",
          "UpdatedWeekly",
          "UpdatedMonthly",
          "UpdatedYearly",
        ]
      x-oapi-codegen-extra-tags:
        json: "update_period,omitempty"
        xml: "http://purl.org/rss/1.0/modules/syndication/ updatePeriod,omitempty"
        validate: "omitempty,oneof=hourly daily weekly monthly yearly"
      x-go-type-skip-optional-pointer: false
    SYUpdateFrequency:
      description: >
        describes the frequency of updates in relation to the update period.
      type: integer
      x-oapi-codegen-extra-tags:
        json: "update_frequency,omitempty"
        xml: "http://purl.org/rss/1.0/modules/syndication/ updateFrequency,omitempty"
        validate: "omitempty,number,gte=1"
      x-go-type-skip-optional-pointer: false
    SYUpdateBase:
      description: >
        is a base date to be used in concert with updatePeriod and updateFrequency to calculate the publishing schedule.
      type: object
      allOf:
        - $ref: "dc.yaml#/components/schemas/DCDate"
      x-oapi-codegen-extra-tags:
        json: "update_base,omitempty"
        xml: "http://purl.org/rss/1.0/modules/syndication/ updateBase,omitempty"
      x-go-type-skip-optional-pointer: false
    SyndicationElements:
      description: >
        contains all syndication extension elements.
      type: object
      properties:
        SYUdatePeriod:
          $ref: "#/components/schemas/SYUpdatePeriod"
        SYUpdateFrequency:
          $ref: "#/components/schemas/SYUpdateFrequency"
        SYUpdateBase:
          $ref: "#/components/schemas/SYUpdateBase"
