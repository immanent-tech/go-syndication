---
openapi: "3.1.0"
info:
  version: 1.0.0
  title: Slash Namespace
  description: >
    The Slash namespace provides metadata about user engagement, particularly comment counts. Originally created by
    Slashdot, it's now widely used to indicate discussion activity on feed items.
  contact:
    name: "Joshua Rich"
    email: joshua.rich@gmail.com
  license:
    identifier: MIT
components:
  schemas:
    Department:
      description: defines a department to which this item belongs.
      type: string
      x-oapi-codegen-extra-tags:
        json: "slash_department,omitempty"
        xml: "slashDepartment,omitempty"
      x-go-type-skip-optional-pointer: false
    Section:
      description: defines a section to which this item belongs.
      type: string
      x-oapi-codegen-extra-tags:
        json: "slash_section,omitempty"
        xml: "slashSection,omitempty"
      x-go-type-skip-optional-pointer: false
    HitParade:
      type: string
      x-oapi-codegen-extra-tags:
        json: "slash_hit_parade,omitempty"
        xml: "slashHitParade,omitempty"
      x-go-type-skip-optional-pointer: false
    Comments:
      description: contains a non-negative integer that counts the number of comments that an item has received.
      type: integer
      x-oapi-codegen-extra-tags:
        json: "slash_comments,omitempty"
        xml: "slashComments,omitempty"
        validate: "omitempty,number,gte=0"
      x-go-type-skip-optional-pointer: false
    Elements:
      description: contains all the slash namespace elements as an embeddable object.
      type: object
      properties:
        slash_comments:
          $ref: "#/components/schemas/Comments"
        slash_section:
          $ref: "#/components/schemas/Section"
        slash_department:
          $ref: "#/components/schemas/Department"
        slash_hit_parade:
          $ref: "#/components/schemas/HitParade"
